<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="authPage" class="auth-container">
  <div class="auth-card">
    <h1>TaskFlow</h1><p>Task Management Application</p>
    <div class="tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Register</button></div>
    <form id="loginForm">
      <input id="loginEmail" type="email" placeholder="Email" required>
      <input id="loginPassword" type="password" placeholder="Password" required>
      <button>Login</button>
    </form>
    <form id="registerForm" class="hidden">
      <input id="registerName" placeholder="Full Name" required>
      <input id="registerEmail" type="email" placeholder="Email" required>
      <input id="registerPassword" type="password" placeholder="Password (6+ characters)" required>
      <button>Create Account</button>
    </form>
    <p id="authMessage"></p>
  </div>
</div>

<div id="appPage" class="hidden">
<header><div><h1>TaskFlow</h1><p id="welcomeText"></p></div><button id="logoutBtn">Logout</button></header>
<main>
<section class="stats">
  <div><b>Total</b><strong id="totalCount">0</strong></div>
  <div><b>Pending</b><strong id="pendingCount">0</strong></div>
  <div><b>Completed</b><strong id="completedCount">0</strong></div>
</section>

<section class="card">
<h2 id="formTitle">Add New Task</h2>
<form id="taskForm">
<input type="hidden" id="taskId">
<input id="taskTitle" placeholder="Task title" required>
<textarea id="taskDescription" placeholder="Task description"></textarea>
<div class="row">
<select id="taskPriority"><option>Low</option><option selected>Medium</option><option>High</option></select>
<input id="taskDueDate" type="date">
</div>
<button id="saveTaskBtn">Add Task</button>
<button type="button" id="cancelEditBtn" class="secondary hidden">Cancel Edit</button>
</form>
<p id="taskMessage"></p>
</section>

<section class="card">
<div class="controls"><input id="searchInput" placeholder="Search tasks..."><select id="statusFilter"><option>All</option><option>Pending</option><option>Completed</option></select></div>
<div id="taskList"></div>
</section>
</main>
</div>
<script src="script.js"></script>
</body>
</html>
